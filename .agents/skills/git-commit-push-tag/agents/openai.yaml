---
interface:
  display_name: "Git Commit Push Tag"
  short_description: >-
    Guarded commit, release artifacts, tag, push, and release flow.
  default_prompt: >-
    Use $git-commit-push-tag to analyze the next SemVer bump; mutate only with
    an explicit BUMP, generate release identification without inferred values,
    create a requested GitHub Release only after every prepublication check
    succeeds, and complete it only after every required release-triggered check
    succeeds.
policy:
  allow_implicit_invocation: false
