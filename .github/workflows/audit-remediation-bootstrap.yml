---
name: Audit remediation guarded bootstrap
run-name: Guarded bootstrap PR 79 at ed41487

"on":
  push:
    branches: [test/audit-guard-activation]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: audit-remediation-bootstrap-79
  cancel-in-progress: false

jobs:
  guarded-bootstrap:
    if: >-
      github.repository == 'asphyx0r/git-starter-kit' &&
      github.actor == 'asphyx0r'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_REPO: asphyx0r/git-starter-kit
      TRUSTED_MAIN_SHA: 6d5b6d1fe992022157e0f3ef4b0366836aa713a5
      FIXED_EVENT_BASE64: 
    steps:
      - name: Checkout immutable trusted main without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6d5b6d1fe992022157e0f3ef4b0366836aa713a5
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.20.0"
      - name: Install trusted locked Commitlint
        run: npm ci --ignore-scripts --prefix tools/quality
      - name: Seal fixed request and reject a changed main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TRUSTED_MAIN_SHA"
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" = "$TRUSTED_MAIN_SHA"
          python - <<'PY'
          import base64
          import os
          from pathlib import Path
          event = base64.b64decode(os.environ["FIXED_EVENT_BASE64"], validate=True)
          (Path(os.environ["RUNNER_TEMP"]) / "bootstrap-event.json").write_bytes(event)
          PY
      - name: Validate with immutable main before privileged credentials
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/merge-pull-request.py --dry-run execute \
            --event-file "$RUNNER_TEMP/bootstrap-event.json"
      - name: Generate the existing narrowly scoped App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.AGENT_RULES_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_RULES_APP_PRIVATE_KEY }}
          owner: asphyx0r
          repositories: git-starter-kit
          permission-contents: write
          permission-pull-requests: write
      - name: Revalidate with the App and submit the ordinary merge API
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          python tools/merge-pull-request.py --dry-run execute \
            --event-file "$RUNNER_TEMP/bootstrap-event.json"
          python - <<'PY'
          import importlib.util
          import json
          import os
          from pathlib import Path
          import sys

          sys.path.insert(0, str(Path("tools").resolve()))
          spec = importlib.util.spec_from_file_location(
              "trusted_guard", "tools/merge-pull-request.py"
          )
          guard = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = guard
          spec.loader.exec_module(guard)
          root = Path(os.environ["RUNNER_TEMP"])
          request = guard._read_dispatch_event(root / "bootstrap-event.json")
          payload = {
              "sha": request.expected_head_oid,
              "merge_method": "squash",
              "commit_title": request.message.subject,
              "commit_message": request.message.body.decode("utf-8"),
          }
          path = root / "bootstrap-merge.json"
          path.write_text(json.dumps(payload), encoding="utf-8")
          try:
              guard._run_gh([
                  "api", "--method", "PUT",
                  f"repos/{request.repository}/pulls/{request.pull_request}/merge",
                  "--input", str(path),
              ])
          finally:
              guard._verify_postcondition(request, root / "actual-message.txt")
          print("Fixed guarded bootstrap merge and exact message confirmed.")
          PY
