---
name: Agent rules update

"on":
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-rules-update
  cancel-in-progress: false

env:
  RULES_REPOSITORY: asphyx0r/agent-coding-rules
  SYNC_BRANCH: automation/agent-rules-update

jobs:
  update:
    if: vars.AGENT_RULES_SYNC_ENABLED != 'false'
    name: Prepare agent rules pull request
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: target

    steps:
      - name: Generate target repository token
        id: target-token
        # actions/create-github-app-token@v3
        uses: >-
          actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.AGENT_RULES_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_RULES_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check out target repository
        # actions/checkout@v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          path: target
          persist-credentials: true
          token: ${{ steps.target-token.outputs.token }}

      - name: Resolve latest agent rules release
        id: rules
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_ref="$(
            gh api "repos/${RULES_REPOSITORY}/releases/latest" --jq '.tag_name'
          )"
          pattern='^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$'
          if [[ ! "${latest_ref}" =~ ${pattern} ]]; then
            printf 'Invalid agent rules release tag: %s\n' "${latest_ref}" >&2
            exit 1
          fi
          printf 'ref=%s\n' "${latest_ref}" >>"${GITHUB_OUTPUT}"

      - name: Check out canonical source and synchronization tool
        shell: bash
        env:
          RULES_REF: ${{ steps.rules.outputs.ref }}
        run: |
          set -euo pipefail
          source_root='../agent-rules-source'
          git init "${source_root}"
          git -C "${source_root}" remote add origin \
            "https://github.com/${RULES_REPOSITORY}.git"
          git -C "${source_root}" fetch --depth=1 origin \
            "refs/tags/${RULES_REF}:refs/tags/${RULES_REF}"
          git -C "${source_root}" checkout --detach \
            "refs/tags/${RULES_REF}^{}"
          actual_ref="$(
            git -C "${source_root}" describe --tags --exact-match HEAD
          )"
          test "${actual_ref}" = "${RULES_REF}"

      - name: Prepare synchronization branch
        shell: bash
        run: git switch --create "${SYNC_BRANCH}"

      - name: Apply agent rules update
        shell: bash
        run: |
          set -euo pipefail
          sync_tool='../agent-rules-source/tools/agent-rules-sync.py'
          python "${sync_tool}" plan \
            --source ../agent-rules-source \
            --target . \
            >"${RUNNER_TEMP}/agent-rules-plan.json"
          python "${sync_tool}" apply \
            --source ../agent-rules-source \
            --target . \
            --backup-directory "${RUNNER_TEMP}/agent-rules-backup"

      - name: Verify synchronized rules
        shell: bash
        run: |
          set -euo pipefail
          python ../agent-rules-source/tools/agent-rules-sync.py check \
            --source ../agent-rules-source \
            --target .

      - name: Verify change scope
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          allowed_pattern='^(AGENTS|CODING_RULES|COMMIT_RULES|DOCUMENTATION_RULES|LANGUAGE_RULES|RELEASE_RULES)\.md$'
          allowed_pattern+='|^_agent-rules-source\.json$'
          changed=false
          while IFS= read -r path; do
            [[ -n "${path}" ]] || continue
            changed=true
            if [[ ! "${path}" =~ ${allowed_pattern} ]]; then
              printf 'Unexpected changed path: %s\n' "${path}" >&2
              exit 1
            fi
          done < <(git status --short | sed 's/^...//')
          printf 'changed=%s\n' "${changed}" >>"${GITHUB_OUTPUT}"

      - name: Compare existing automation branch
        if: steps.changes.outputs.changed == 'true'
        id: existing
        shell: bash
        run: |
          set -euo pipefail
          same=false
          if git ls-remote --exit-code --heads origin "${SYNC_BRANCH}" \
            >/dev/null 2>&1; then
            git fetch origin \
              "${SYNC_BRANCH}:refs/remotes/origin/${SYNC_BRANCH}"
            if git diff --quiet "origin/${SYNC_BRANCH}" -- \
              AGENTS.md CODING_RULES.md COMMIT_RULES.md \
              DOCUMENTATION_RULES.md LANGUAGE_RULES.md RELEASE_RULES.md \
              _agent-rules-source.json; then
              same=true
            fi
          fi
          printf 'same=%s\n' "${same}" >>"${GITHUB_OUTPUT}"

      - name: Commit and push synchronization branch
        if: >-
          steps.changes.outputs.changed == 'true' &&
          steps.existing.outputs.same != 'true'
        shell: bash
        env:
          RULES_REF: ${{ steps.rules.outputs.ref }}
        run: |
          set -euo pipefail
          git config user.name "agent-rules-sync[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            AGENTS.md CODING_RULES.md COMMIT_RULES.md \
            DOCUMENTATION_RULES.md LANGUAGE_RULES.md RELEASE_RULES.md \
            _agent-rules-source.json
          git commit -m "chore(rules): sync agent rules to ${RULES_REF}"
          git push --force-with-lease origin \
            "HEAD:refs/heads/${SYNC_BRANCH}"

      - name: Open or update pull request
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.target-token.outputs.token }}
          RULES_REF: ${{ steps.rules.outputs.ref }}
        run: |
          set -euo pipefail
          preserved="$(
            jq -r '
              [
                .actions[]
                | select(
                    .action == "preserved"
                    or .action == "preserve-customized"
                  )
                | "- `\(.path)`"
              ]
              | if length == 0 then "None." else join("\n") end
            ' "${RUNNER_TEMP}/agent-rules-plan.json"
          )"
          body="$(
            printf '%s\n\n%s\n\n%s\n%s\n\n%s\n%s\n' \
              "Synchronizes rules from the canonical source." \
              "Source release: \`${RULES_REF}\`" \
              "Customized files preserved:" \
              "${preserved}" \
              "The repository validation workflow must pass before merge." \
              "Automatic merge is intentionally disabled."
          )"
          title="chore(rules): sync agent rules to ${RULES_REF}"
          if gh pr view "${SYNC_BRANCH}" --json url >/dev/null 2>&1; then
            gh pr edit "${SYNC_BRANCH}" --title "${title}" --body "${body}"
          else
            gh pr create \
              --base "${{ github.event.repository.default_branch }}" \
              --head "${SYNC_BRANCH}" \
              --title "${title}" \
              --body "${body}"
          fi
