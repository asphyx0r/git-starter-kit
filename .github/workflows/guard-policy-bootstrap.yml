---
name: Guard merge policy bootstrap
run-name: Guard policy bootstrap PR 82 at e1cd159

"on":
  push:
    branches: [codex/guard-bootstrap-2-12-0]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: guard-policy-bootstrap-82
  cancel-in-progress: false

jobs:
  guarded-bootstrap:
    if: >-
      github.repository == 'asphyx0r/git-starter-kit' &&
      github.actor == 'asphyx0r' &&
      github.ref == 'refs/heads/codex/guard-bootstrap-2-12-0'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_REPO: asphyx0r/git-starter-kit
      TRUSTED_MAIN_SHA: 360879394d18f26cd7102723734735e979d8238f
      FIXED_EVENT_BASE64: 
      GUARD_PATCH_BASE64: 
      GUARD_PATCH_SHA256: edd4cbe70efcb64959d440d8cd0b1c2fe0075f79a24faf95d9fac045ed8963a5
      GUARDED_SOURCE_SHA256: 8654412118930ec4cc67b3ed4044a5c5164309fa5c5c81f023c4f9419396fe08
    steps:
      - name: Check out immutable main without credentials
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 360879394d18f26cd7102723734735e979d8238f
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        # actions/setup-python@v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Set up Node
        # actions/setup-node@v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: |
            tools/quality/package-lock.json
            tools/quality/versions.json
      - name: Install trusted locked Commitlint
        run: |
          npm ci --ignore-scripts --prefix tools/quality
          python tools/quality/npm-security.py patch
      - name: Seal the reviewed correction and request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TRUSTED_MAIN_SHA"
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" = "$TRUSTED_MAIN_SHA"
          python - <<'PY'
          import base64
          import hashlib
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          patch = base64.b64decode(os.environ["GUARD_PATCH_BASE64"], validate=True)
          if hashlib.sha256(patch).hexdigest() != os.environ["GUARD_PATCH_SHA256"]:
              raise SystemExit("Reviewed patch digest mismatch.")
          (root / "guard-policy.patch").write_bytes(patch)
          event = base64.b64decode(os.environ["FIXED_EVENT_BASE64"], validate=True)
          (root / "guard-policy-event.json").write_bytes(event)
          PY
          git apply --check "$RUNNER_TEMP/guard-policy.patch"
          git apply "$RUNNER_TEMP/guard-policy.patch"
          test "$(git diff --name-only)" = tools/merge-pull-request.py
          printf '%s  %s\n' "$GUARDED_SOURCE_SHA256" tools/merge-pull-request.py | sha256sum --check
      - name: Prove read-only policy access and validate every guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO" > "$RUNNER_TEMP/read-only-repository.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads((Path(os.environ["RUNNER_TEMP"]) / "read-only-repository.json").read_text())
          fields = ("allow_auto_merge", "allow_merge_commit", "allow_rebase_merge", "allow_squash_merge", "fork")
          print(json.dumps({field: value.get(field, "omitted") for field in fields}, sort_keys=True))
          PY
          python tools/merge-pull-request.py --dry-run execute \
            --event-file "$RUNNER_TEMP/guard-policy-event.json"
      - name: Generate the existing narrowly scoped App token
        id: app-token
        # actions/create-github-app-token@v3
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.AGENT_RULES_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_RULES_APP_PRIVATE_KEY }}
          owner: asphyx0r
          repositories: git-starter-kit
          permission-contents: write
          permission-pull-requests: write
      - name: Revalidate and submit the ordinary squash merge
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" = "$TRUSTED_MAIN_SHA"
          printf '%s  %s\n' "$GUARDED_SOURCE_SHA256" tools/merge-pull-request.py | sha256sum --check
          python tools/merge-pull-request.py execute \
            --event-file "$RUNNER_TEMP/guard-policy-event.json"
