---
name: Release package

"on":
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Repository release tag whose package assets will be uploaded
        required: true
        type: string
      agent_rules_ref:
        description: latest or the same latest published agent-coding-rules SemVer tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-package-${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release package
    if: github.repository == 'asphyx0r/git-starter-kit'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      release_tag: ${{ steps.refs.outputs.starter_ref }}
      release_sha: ${{ steps.refs.outputs.starter_sha }}
      package_name: ${{ steps.seal.outputs.package_name }}
      toolkit_name: ${{ steps.seal.outputs.toolkit_name }}
      package_sha256: ${{ steps.seal.outputs.package_sha256 }}
      toolkit_sha256: ${{ steps.seal.outputs.toolkit_sha256 }}

    steps:
      - name: Checkout release tag
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}

      - name: Set up Python
        # actions/setup-python@v7.0.0
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/quality/requirements.lock

      - name: Set up Node.js
        # actions/setup-node@v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: |
            tools/quality/package-lock.json
            tools/quality/versions.json

      - name: Install locked quality dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            --require-hashes -r tools/quality/requirements.lock
          npm ci --ignore-scripts --prefix tools/quality

      - name: Resolve release inputs
        id: refs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_AGENT_RULES_REF: ${{ inputs.agent_rules_ref }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            starter_ref="$RELEASE_TAG"
            agent_rules_ref="latest"
          else
            starter_ref="$INPUT_TAG"
            agent_rules_ref="$INPUT_AGENT_RULES_REF"
          fi

          # Keep this pattern aligned with repository-audit SemVer smoke tests.
          semver_tag_pattern='^v(0|[1-9][0-9]*)\.'
          semver_tag_pattern+='(0|[1-9][0-9]*)\.'
          semver_tag_pattern+='(0|[1-9][0-9]*)'
          semver_tag_pattern+='(-((0|[1-9][0-9]*|[0-9A-Za-z-]*'
          semver_tag_pattern+='[A-Za-z-][0-9A-Za-z-]*)'
          semver_tag_pattern+='(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*'
          semver_tag_pattern+='[A-Za-z-][0-9A-Za-z-]*))*))?'
          semver_tag_pattern+='(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'
          if ! [[ "$starter_ref" =~ $semver_tag_pattern ]]; then
            echo "starter_ref must be a SemVer tag prefixed with v." >&2
            exit 1
          fi

          if [ -z "${agent_rules_ref:-}" ]; then
            echo "agent_rules_ref must be set to latest or a SemVer tag." >&2
            exit 1
          fi

          if [ "$agent_rules_ref" != "latest" ] &&
            ! [[ "$agent_rules_ref" =~ $semver_tag_pattern ]]; then
            message="agent_rules_ref must be latest or a SemVer tag"
            message+=" prefixed with v."
            echo "$message" >&2
            exit 1
          fi

          {
            echo "starter_ref=$starter_ref"
            echo "starter_sha=$(git rev-parse HEAD)"
            echo "agent_rules_ref=$agent_rules_ref"
          } >>"$GITHUB_OUTPUT"

      - name: Build package
        id: package
        shell: pwsh
        env:
          REPOSITORY_REF: ${{ steps.refs.outputs.starter_ref }}
          AGENT_RULES_REF: ${{ steps.refs.outputs.agent_rules_ref }}
          PACKAGE_NAME: git-starter-kit-${{ steps.refs.outputs.starter_ref }}-with-agent-rules.zip
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./tools/build-release-package.ps1 `
            -RepositoryRef $env:REPOSITORY_REF `
            -AgentRulesRef $env:AGENT_RULES_REF `
            -OutputDirectory $env:RUNNER_TEMP `
            -PackageName $env:PACKAGE_NAME

      - name: Validate composed package
        shell: bash
        env:
          PACKAGE_PATH: ${{ steps.package.outputs.package_path }}
        run: |
          validation_root="$RUNNER_TEMP/release-package-validation"
          mkdir -p "$validation_root"
          python -m zipfile -e "$PACKAGE_PATH" "$validation_root"
          cd "$validation_root"
          "$GITHUB_WORKSPACE/tools/quality/node_modules/.bin/markdownlint-cli2" \
            --config .markdownlint-cli2.yaml "**/*.md"
          codespell --config .codespellrc .

      - name: Build upgrade toolkit
        id: toolkit
        shell: bash
        env:
          PACKAGE_PATH: ${{ steps.package.outputs.package_path }}
          REPOSITORY_REF: ${{ steps.refs.outputs.starter_ref }}
        run: |
          repository_name="${GITHUB_REPOSITORY##*/}"
          toolkit_path="$RUNNER_TEMP/${repository_name}-${REPOSITORY_REF}-upgrade-toolkit.zip"
          python tools/starter-kit-upgrade.py toolkit \
            --new-package "$PACKAGE_PATH" \
            --output "$toolkit_path"
          echo "toolkit_path=$toolkit_path" >>"$GITHUB_OUTPUT"

      - name: Seal release payload
        id: seal
        shell: bash
        env:
          PACKAGE_PATH: ${{ steps.package.outputs.package_path }}
          TOOLKIT_PATH: ${{ steps.toolkit.outputs.toolkit_path }}
          RELEASE_TAG: ${{ steps.refs.outputs.starter_ref }}
          TRANSFER_ROOT: ${{ runner.temp }}/release-package-transfer
          EXPECTED_SUMS_PATH: ${{ runner.temp }}/release-package-build-expected-sha256s
        run: |
          set -euo pipefail

          if [ -e "$TRANSFER_ROOT" ]; then
            echo "Release payload transfer path already exists." >&2
            exit 1
          fi
          mkdir "$TRANSFER_ROOT"

          package_name="git-starter-kit-${RELEASE_TAG}-with-agent-rules.zip"
          toolkit_name="git-starter-kit-${RELEASE_TAG}-upgrade-toolkit.zip"
          if [ "$(basename "$PACKAGE_PATH")" != "$package_name" ] ||
            [ "$(basename "$TOOLKIT_PATH")" != "$toolkit_name" ]; then
            echo "Release payload filenames do not match the validated tag." >&2
            exit 1
          fi

          cp -- "$PACKAGE_PATH" "$TRANSFER_ROOT/$package_name"
          cp -- "$TOOLKIT_PATH" "$TRANSFER_ROOT/$toolkit_name"
          package_sha256="$(sha256sum "$TRANSFER_ROOT/$package_name" | cut -d' ' -f1)"
          toolkit_sha256="$(sha256sum "$TRANSFER_ROOT/$toolkit_name" | cut -d' ' -f1)"
          printf '%s  %s\n%s  %s\n' \
            "$package_sha256" "$package_name" \
            "$toolkit_sha256" "$toolkit_name" \
            >"$TRANSFER_ROOT/SHA256SUMS"
          printf '%s  %s\n%s  %s\n' \
            "$package_sha256" "$package_name" \
            "$toolkit_sha256" "$toolkit_name" \
            >"$EXPECTED_SUMS_PATH"

          python - "$TRANSFER_ROOT" \
            "$package_name" "$toolkit_name" <<'PY'
          import os
          from pathlib import Path
          import stat
          import sys

          root = Path(sys.argv[1])
          allowed = {sys.argv[2], sys.argv[3], "SHA256SUMS"}
          entries = list(os.scandir(root))
          if len(entries) != 3 or {entry.name for entry in entries} != allowed:
              raise SystemExit("Release payload must contain exactly three named files.")
          for entry in entries:
              mode = entry.stat(follow_symlinks=False).st_mode
              if entry.is_symlink() or not stat.S_ISREG(mode):
                  raise SystemExit(f"Release payload entry is not regular: {entry.name}")
          PY
          if ! cmp -s "$EXPECTED_SUMS_PATH" "$TRANSFER_ROOT/SHA256SUMS"; then
            echo "Release payload checksum manifest changed." >&2
            exit 1
          fi
          (
            cd "$TRANSFER_ROOT"
            sha256sum --check --strict SHA256SUMS
          )

          {
            echo "package_name=$package_name"
            echo "toolkit_name=$toolkit_name"
            echo "package_sha256=$package_sha256"
            echo "toolkit_sha256=$toolkit_sha256"
          } >>"$GITHUB_OUTPUT"

      - name: Upload sealed release payload
        # actions/upload-artifact@v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-package-${{ steps.refs.outputs.starter_ref }}
          path: |
            ${{ runner.temp }}/release-package-transfer/${{ steps.seal.outputs.package_name }}
            ${{ runner.temp }}/release-package-transfer/${{ steps.seal.outputs.toolkit_name }}
            ${{ runner.temp }}/release-package-transfer/SHA256SUMS
          if-no-files-found: error

  release-checks:
    name: Verify release event checks
    needs: build
    if: github.repository == 'asphyx0r/git-starter-kit'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout immutable verifier
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: tools/verify-repository-audit-runs.py
          sparse-checkout-cone-mode: false

      - name: Require successful release event workflows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.build.outputs.release_sha }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 1800))
          published_at="$(timeout 30s gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" \
            --jq 'select(.draft == false) | .published_at')"
          if [[ -z "$published_at" || "$published_at" == null ]]; then
            echo "A published release is required for event verification." >&2
            exit 1
          fi
          workflow_ids=()
          for workflow in repository-audit.yml agent-rules-update.yml; do
            workflow_ids+=("$(timeout 30s gh api "repos/$GH_REPO/actions/workflows/$workflow" --jq '.id')")
          done
          for workflow_id in "${workflow_ids[@]}"; do
            remaining=$((deadline - SECONDS))
            if ((remaining <= 0)); then
              echo "Release checks exceeded the shared 30-minute deadline." >&2
              exit 1
            fi
            python tools/verify-repository-audit-runs.py \
              --repository "$GH_REPO" --workflow-id "$workflow_id" \
              --event release --sha "$RELEASE_SHA" --ref "$RELEASE_TAG" \
              --created-after "$published_at" --timeout-seconds "$remaining" \
              --poll-seconds 5 --verbose
          done

  publish:
    name: Publish release package
    needs: [build, release-checks]
    if: github.repository == 'asphyx0r/git-starter-kit'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release
    permissions:
      contents: write

    steps:
      - name: Download sealed release payload
        # actions/download-artifact@v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-package-${{ needs.build.outputs.release_tag }}
          path: ${{ runner.temp }}/release-package-publish

      - name: Verify sealed release payload
        id: verify
        shell: bash
        env:
          TRANSFER_ROOT: ${{ runner.temp }}/release-package-publish
          EXPECTED_PACKAGE_NAME: ${{ needs.build.outputs.package_name }}
          EXPECTED_TOOLKIT_NAME: ${{ needs.build.outputs.toolkit_name }}
          EXPECTED_PACKAGE_SHA256: ${{ needs.build.outputs.package_sha256 }}
          EXPECTED_TOOLKIT_SHA256: ${{ needs.build.outputs.toolkit_sha256 }}
          EXPECTED_SUMS_PATH: ${{ runner.temp }}/release-package-publish-expected-sha256s
        run: |
          set -euo pipefail

          python - "$TRANSFER_ROOT" \
            "$EXPECTED_PACKAGE_NAME" "$EXPECTED_TOOLKIT_NAME" <<'PY'
          import os
          from pathlib import Path
          import stat
          import sys

          root = Path(sys.argv[1])
          allowed = {sys.argv[2], sys.argv[3], "SHA256SUMS"}
          entries = list(os.scandir(root))
          if len(entries) != 3 or {entry.name for entry in entries} != allowed:
              raise SystemExit("Release payload must contain exactly three named files.")
          for entry in entries:
              mode = entry.stat(follow_symlinks=False).st_mode
              if entry.is_symlink() or not stat.S_ISREG(mode):
                  raise SystemExit(f"Release payload entry is not regular: {entry.name}")
          PY
          printf '%s  %s\n%s  %s\n' \
            "$EXPECTED_PACKAGE_SHA256" "$EXPECTED_PACKAGE_NAME" \
            "$EXPECTED_TOOLKIT_SHA256" "$EXPECTED_TOOLKIT_NAME" \
            >"$EXPECTED_SUMS_PATH"
          if ! cmp -s "$EXPECTED_SUMS_PATH" "$TRANSFER_ROOT/SHA256SUMS"; then
            echo "Release payload checksum manifest changed." >&2
            exit 1
          fi
          (
            cd "$TRANSFER_ROOT"
            sha256sum --check --strict SHA256SUMS
          )

      - name: Publish release assets
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          EVENT_NAME: ${{ github.event_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          TRANSFER_ROOT: ${{ runner.temp }}/release-package-publish
          PACKAGE_NAME: ${{ needs.build.outputs.package_name }}
          TOOLKIT_NAME: ${{ needs.build.outputs.toolkit_name }}
          EXPECTED_PACKAGE_SHA256: ${{ needs.build.outputs.package_sha256 }}
          EXPECTED_TOOLKIT_SHA256: ${{ needs.build.outputs.toolkit_sha256 }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          from urllib.parse import quote

          repository = os.environ["GH_REPO"]
          tag = os.environ["RELEASE_TAG"]
          root = Path(os.environ["TRANSFER_ROOT"])
          package = os.environ["PACKAGE_NAME"]
          toolkit = os.environ["TOOLKIT_NAME"]
          hashes = {
              package: os.environ["EXPECTED_PACKAGE_SHA256"],
              toolkit: os.environ["EXPECTED_TOOLKIT_SHA256"],
          }
          sums = "".join(f"{digest}  {name}\n" for name, digest in hashes.items()).encode("ascii")
          hashes["SHA256SUMS"] = hashlib.sha256(sums).hexdigest()
          expected = {}
          for name, digest in hashes.items():
              content = (root / name).read_bytes()
              if hashlib.sha256(content).hexdigest() != digest:
                  raise SystemExit(f"Sealed local payload changed: {name}")
              expected[name] = (len(content), digest)

          def api(endpoint, *arguments):
              result = subprocess.run(
                  ["timeout", "30s", "gh", "api", endpoint, *arguments],
                  check=True, stdout=subprocess.PIPE,
              )
              return json.loads(result.stdout) if result.stdout.strip() else None

          release = api(f"repos/{repository}/releases/tags/{quote(tag, safe='')}")
          release_id = release["id"]
          if type(release_id) is not int or release_id <= 0:
              raise SystemExit("Invalid release ID.")
          release_endpoint = f"repos/{repository}/releases/{release_id}"

          def require_release(current):
              if (
                  current.get("id") != release_id or current.get("tag_name") != tag
                  or current.get("draft") is not False or not current.get("published_at")
                  or type(current.get("prerelease")) is not bool
              ):
                  raise SystemExit("Selected published release identity changed.")
              return current

          def asset_endpoint(asset):
              asset_id = asset.get("id")
              if type(asset_id) is not int or asset_id <= 0:
                  raise SystemExit("Invalid release asset ID.")
              return f"repos/{repository}/releases/assets/{asset_id}"

          def require_uploaded(asset):
              name = asset["name"]
              size, digest = expected[name]
              if asset.get("state") != "uploaded" or asset.get("size") != size:
                  raise SystemExit(f"Release asset state or size differs: {name}")
              asset_endpoint(asset)
              remote_digest = asset.get("digest")
              if remote_digest is None:
                  checksum = hashlib.sha256()
                  downloaded_size = 0
                  with subprocess.Popen(
                      ["timeout", "30s", "gh", "api", asset_endpoint(asset),
                       "-H", "Accept: application/octet-stream"], stdout=subprocess.PIPE,
                  ) as process:
                      while chunk := process.stdout.read(1024 * 1024):
                          downloaded_size += len(chunk)
                          checksum.update(chunk)
                      if process.wait() != 0:
                          raise SystemExit(f"Cannot verify release asset: {name}")
                  if (downloaded_size, checksum.hexdigest()) != (size, digest):
                      raise SystemExit(f"Downloaded release asset differs: {name}")
              elif (
                  not isinstance(remote_digest, str)
                  or re.fullmatch(r"sha256:[0-9a-f]{64}", remote_digest) is None
                  or remote_digest != f"sha256:{digest}"
              ):
                  raise SystemExit(f"Release asset digest differs or is malformed: {name}")

          def classify_assets(allow_starter):
              pages = api(release_endpoint + "/assets", "--paginate", "--slurp")
              assets = [asset for page in pages for asset in page]
              by_name = {}
              ids = set()
              starters = []
              for asset in assets:
                  name = asset.get("name")
                  endpoint = asset_endpoint(asset)
                  if name not in expected or name in by_name or endpoint in ids:
                      raise SystemExit("Unexpected or duplicate release asset.")
                  by_name[name] = asset
                  ids.add(endpoint)
                  if allow_starter and asset.get("state") == "starter" and asset.get("size") == 0:
                      starters.append(asset)
                  else:
                      require_uploaded(asset)
              return by_name, starters

          require_release(release)
          existing, starters = classify_assets(allow_starter=True)
          require_release(api(release_endpoint))
          for asset in starters:
              confirmed = api(asset_endpoint(asset))
              if any(confirmed.get(key) != asset.get(key) for key in ("id", "name", "state", "size")):
                  raise SystemExit("Incomplete release asset changed before repair.")
          for asset in starters:
              api(asset_endpoint(asset), "--method", "DELETE")
          for name in expected:
              if name not in existing or existing[name] in starters:
                  api(
                      f"https://uploads.github.com/repos/{repository}/releases/{release_id}"
                      f"/assets?name={quote(name, safe='')}",
                      "--method", "POST", "-H", "Content-Type: application/octet-stream",
                      "--input", str(root / name),
                  )

          uploaded, _ = classify_assets(allow_starter=False)
          if set(uploaded) != set(expected):
              raise SystemExit("Release payload is incomplete after upload.")
          current = require_release(api(release_endpoint))
          if (
              os.environ["EVENT_NAME"] == "release"
              and os.environ["PRERELEASE"] == "true" and current["prerelease"]
          ):
              api(release_endpoint, "--method", "PATCH", "-F", "prerelease=false", "-f", "make_latest=true")
          PY
