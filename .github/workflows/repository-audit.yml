---
name: Repository audit
'on':
  release:
    types:
      - published
  push: null
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      qualification_experiment:
        description: Measure the experimental qualification protocol
        type: boolean
        required: false
        default: false
permissions:
  contents: read
env:
  NODE_VERSION: 24.20.0
concurrency:
  group: repository-audit-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name ==
    'push' && github.ref_type == 'branch' && !startsWith(github.ref_name, 'codex/release-preflight-') && github.ref)
    || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type
    == 'branch' && !startsWith(github.ref_name, 'codex/release-preflight-')) }}
jobs:
  activation:
    name: Read trusted automation configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      enabled: ${{ steps.resolve.outputs.enabled || steps.activation.outputs.enabled }}
      trusted_sha: ${{ steps.resolve.outputs.trusted_sha }}
    steps:
      - id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_DELETED: ${{ github.event.deleted }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == push && "$EVENT_DELETED" == true ]]; then
            printf 'enabled=false\n' >> "$GITHUB_OUTPUT"
            printf '%s\n' 'Reference deletion: no new commit to audit.'
            exit 0
          fi
          if [[ "$EVENT_NAME" != push || "$REF_TYPE" != branch ||
            "$REF_NAME" != codex/release-preflight-* ]]; then
            printf 'enabled=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set -euo pipefail
          default_branch="$(gh api "repos/$GH_REPO" --jq '.default_branch')"
          export DEFAULT_BRANCH="$default_branch"
          encoded_branch="$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["DEFAULT_BRANCH"], safe=""))')"
          trusted_sha="$(gh api "repos/$GH_REPO/commits/$encoded_branch" --jq '.sha')"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          printf 'trusted_sha=%s\n' "$trusted_sha" >> "$GITHUB_OUTPUT"
        name: Resolve immutable default-branch snapshot
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ steps.resolve.outputs.trusted_sha }}
        if: steps.resolve.outputs.trusted_sha != ''
        name: Check out the immutable revision
      - id: activation
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |-
          python3 -B tools/automation_config.py \
            --automation releasePreflight --event "$EVENT_NAME" >> "$GITHUB_OUTPUT"
        if: steps.resolve.outputs.trusted_sha != ''
        name: Read activation before dependencies and credentials
      - name: Check out candidate source without changing activation
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
        if: github.repository == 'asphyx0r/git-starter-kit' && steps.resolve.outputs.enabled != 'false' && (github.event_name
          == 'release' || (github.event_name == 'push' && github.ref_type == 'tag'))
      - name: Resolve immutable qualification candidate
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(python -B tools/project_validation.py --scope)" == source ]]; then
            python -B tools/quality/qualification.py resolve --output "$RUNNER_TEMP/candidate.json"
          else
            printf '%s\n' '{"decision":"full","reason":"consumer repository"}' > "$RUNNER_TEMP/candidate.json"
          fi
        if: github.repository == 'asphyx0r/git-starter-kit' && steps.resolve.outputs.enabled != 'false' && (github.event_name
          == 'release' || (github.event_name == 'push' && github.ref_type == 'tag'))
        env:
          AUDIT_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
      - name: Retain candidate identity
        # actions/upload-artifact@v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qualification-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
        if: github.repository == 'asphyx0r/git-starter-kit' && steps.resolve.outputs.enabled != 'false' && (github.event_name
          == 'release' || (github.event_name == 'push' && github.ref_type == 'tag'))
        continue-on-error: true
  quality-linux:
    needs: activation
    if: needs.activation.outputs.enabled == 'true'
    name: Quality - Ubuntu 24.04 / Python 3.11
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - name: Checkout repository
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact audit revision
        shell: bash
        env:
          AUDIT_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$AUDIT_COMMIT_SHA"
      - name: Prepare previous push commit
        shell: bash
        timeout-minutes: 2
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: '0'
          GH_PROMPT_DISABLED: '1'
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != push ||
            "$BEFORE_SHA" == 0000000000000000000000000000000000000000 ]]; then
            exit 0
          fi
          [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'Previous push SHA must be a full commit SHA.' >&2
            exit 1
          }
          if ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            git -c credential.helper= \
              -c 'credential.helper=!gh auth git-credential' \
              fetch --no-tags --no-write-fetch-head --no-recurse-submodules \
              --refmap= origin "$BEFORE_SHA"
          fi
          git cat-file -e "$BEFORE_SHA^{commit}"
      - name: Set up Python
        # actions/setup-python@v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/quality/requirements.lock
      - name: Set up Node
        # actions/setup-node@v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            tools/quality/package-lock.json
            tools/quality/versions.json
      - name: scope
        id: scope
        shell: bash
        run: |-
          scope="$(python -B tools/project_validation.py --scope)"
          printf "scope=%s\n" "$scope" >> "$GITHUB_OUTPUT"
      - name: Check quality declarations
        shell: bash
        run: python -B tools/quality/check-versions.py
      - name: Install locked language toolchains
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check \
            --require-hashes \
            --requirement tools/quality/requirements.lock
          npm ci --ignore-scripts --prefix tools/quality
      - name: Audit locked tool dependencies
        shell: bash
        run: |
          set -euo pipefail
          python tools/quality/npm-security.py audit
          python -m pip_audit --require-hashes --disable-pip \
            --cache-dir "$RUNNER_TEMP/pip-audit" \
            -r tools/quality/requirements.lock
          python -m pip_audit --require-hashes --disable-pip \
            --cache-dir "$RUNNER_TEMP/pip-audit" \
            -r tools/release-artifacts-requirements.txt
      - name: Install verified external tools
        shell: bash
        run: |
          python tools/quality/install-external-tools.py \
            --platform linux-x64 \
            --install-root "$RUNNER_TEMP/quality-tools"
          echo "$RUNNER_TEMP/quality-tools/bin" >> "$GITHUB_PATH"
          echo "PSModulePath=$RUNNER_TEMP/quality-tools/Modules:${PSModulePath:-}" \
            >> "$GITHUB_ENV"
      - name: Run fresh source guards or complete consumer gate
        shell: bash
        env:
          AUDIT_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BEFORE_SHA: ${{ github.event_name == 'release' && '0000000000000000000000000000000000000000' || github.event.before
            }}
          GITHUB_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: Codex
          GIT_AUTHOR_EMAIL: codex@example.com
          GIT_COMMITTER_NAME: Codex
          GIT_COMMITTER_EMAIL: codex@example.com
        run: |
          set -euo pipefail
          if [[ "$(python -B tools/project_validation.py --scope)" == source ]]; then
            source tools/repository-audit.sh
            initialize_repository_root
            run_static_before
            run_static_after
          else
            bash tools/repository-audit.sh full
          fi
      - name: Require project checks
        shell: bash
        run: python -B tools/project_validation.py --repository-root . --timeout 900
      - name: Record fresh environment
        shell: bash
        run: |
          set -euo pipefail
          python tools/quality/coverage-artifacts.py environment --platform linux \
            --output "$RUNNER_TEMP/fresh/linux.json"
        if: steps.scope.outputs.scope == 'source'
        env:
          AUDIT_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Upload fresh environment
        # actions/upload-artifact@v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qualification-fresh-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fresh/linux.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
        if: steps.scope.outputs.scope == 'source'
        continue-on-error: true
  compatibility-windows:
    needs: activation
    if: needs.activation.outputs.enabled == 'true'
    name: Compatibility - Windows 2025 / Python 3.14
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact audit revision
        shell: bash
        env:
          AUDIT_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$AUDIT_COMMIT_SHA"
      - name: Set up Python
        # actions/setup-python@v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: tools/quality/requirements.lock
      - name: scope
        id: scope
        shell: bash
        run: |-
          scope="$(python -B tools/project_validation.py --scope)"
          printf "scope=%s\n" "$scope" >> "$GITHUB_OUTPUT"
      - name: Set up Node
        # actions/setup-node@v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            tools/quality/package-lock.json
            tools/quality/versions.json
      - name: Check quality declarations
        shell: bash
        run: python -B tools/quality/check-versions.py
      - name: Install locked language toolchains
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check `
            --require-hashes `
            --requirement tools/quality/requirements.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --ignore-scripts --prefix tools/quality
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install verified PowerShell and shell tools
        shell: pwsh
        run: |
          python tools/quality/install-external-tools.py `
            --platform windows-x64 `
            --tool PSScriptAnalyzer `
            --tool shellcheck `
            --tool shfmt `
            --install-root "$env:RUNNER_TEMP/quality-tools"
          Add-Content $env:GITHUB_PATH "$env:RUNNER_TEMP/quality-tools/bin"
          Add-Content $env:GITHUB_ENV `
            "PSModulePath=$env:RUNNER_TEMP/quality-tools/Modules$([IO.Path]::PathSeparator)$env:PSModulePath"
      - name: Run cross-platform compatibility checks
        shell: bash
        run: bash tools/repository-audit.sh fast
      - name: Analyze PowerShell on Windows
        shell: bash
        run: bash tools/repository-audit.sh powershell-static
      - name: Require project checks
        shell: bash
        run: python -B tools/project_validation.py --repository-root . --timeout 900
      - name: Record fresh environment
        shell: bash
        run: |
          set -euo pipefail
          python tools/quality/coverage-artifacts.py environment --platform windows \
            --output "$RUNNER_TEMP/fresh/windows.json"
        if: steps.scope.outputs.scope == 'source'
        env:
          AUDIT_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Upload fresh environment
        # actions/upload-artifact@v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qualification-fresh-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fresh/windows.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
        if: steps.scope.outputs.scope == 'source'
        continue-on-error: true
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
  qualification:
    name: Choose common qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    needs:
      - activation
      - quality-linux
      - compatibility-windows
    if: needs.activation.outputs.enabled == 'true'
    outputs:
      decision: ${{ steps.decision.outputs.decision }}
    env:
      VERIFY_REUSE: ${{ github.repository == 'asphyx0r/git-starter-kit' && needs.quality-linux.outputs.scope == 'source'
        && (github.event_name == 'release' || (github.event_name == 'push' && github.ref_type == 'tag')) }}
    steps:
      - name: Checkout repository
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact audit revision
        shell: bash
        env:
          AUDIT_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$AUDIT_COMMIT_SHA"
      - name: Set up Python
        if: env.VERIFY_REUSE == 'true'
        # actions/setup-python@v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/quality/requirements.lock
      - name: Install locked coverage runtime
        if: env.VERIFY_REUSE == 'true'
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check \
            --require-hashes --requirement tools/quality/requirements.lock
      - name: Download selected candidate
        # actions/download-artifact@v8.0.1
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: qualification-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}
        if: env.VERIFY_REUSE == 'true'
        continue-on-error: true
      - name: Download fresh linux
        # actions/download-artifact@v8.0.1
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: qualification-fresh-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fresh
        if: env.VERIFY_REUSE == 'true'
        continue-on-error: true
      - name: Download fresh windows
        # actions/download-artifact@v8.0.1
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: qualification-fresh-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fresh
        if: env.VERIFY_REUSE == 'true'
        continue-on-error: true
      - name: Choose one qualification path
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$VERIFY_REUSE" == true ]]; then
            python -B tools/quality/qualification.py verify \
              --candidate "$RUNNER_TEMP/candidate.json" --fresh "$RUNNER_TEMP/fresh" \
              --destination "$RUNNER_TEMP/verified" --output "$RUNNER_TEMP/decision.json"
          else
            printf 'decision=full\n' >>"$GITHUB_OUTPUT"
          fi
        env:
          AUDIT_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        id: decision
      - name: Retain verified original pair
        # actions/upload-artifact@v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qualification-verified-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verified
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
        if: steps.decision.outputs.decision == 'reuse'
  quality-linux-heavy:
    name: Measured qualification - linux
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs:
      - activation
      - quality-linux
      - compatibility-windows
      - qualification
    if: needs.activation.outputs.enabled == 'true' && needs.quality-linux.outputs.scope == 'source' && needs.qualification.outputs.decision
      == 'full'
    steps:
      - name: Checkout repository
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact audit revision
        shell: bash
        env:
          AUDIT_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$AUDIT_COMMIT_SHA"
      - name: Set up Python
        # actions/setup-python@v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/quality/requirements.lock
      - name: Set up Node
        # actions/setup-node@v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            tools/quality/package-lock.json
            tools/quality/versions.json
      - name: Check quality declarations
        shell: bash
        run: python -B tools/quality/check-versions.py
      - name: Install locked language toolchains
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check \
            --require-hashes \
            --requirement tools/quality/requirements.lock
          npm ci --ignore-scripts --prefix tools/quality
      - name: Install verified external tools
        shell: bash
        run: |
          python tools/quality/install-external-tools.py \
            --platform linux-x64 \
            --install-root "$RUNNER_TEMP/quality-tools"
          echo "$RUNNER_TEMP/quality-tools/bin" >> "$GITHUB_PATH"
          echo "PSModulePath=$RUNNER_TEMP/quality-tools/Modules:${PSModulePath:-}" \
            >> "$GITHUB_ENV"
      - name: Record actual heavy environment before tests
        shell: bash
        run: |
          set -euo pipefail
          python tools/quality/coverage-artifacts.py environment --platform linux \
            --output "$RUNNER_TEMP/heavy-before.json"
        env:
          AUDIT_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Run measured Python and shell suites
        shell: bash
        env:
          AUDIT_COVERAGE_DIR: ${{ runner.temp }}/coverage/linux
          AUDIT_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BEFORE_SHA: ${{ github.event_name == 'release' && '0000000000000000000000000000000000000000' || github.event.before
            }}
          GITHUB_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: Codex
          GIT_AUTHOR_EMAIL: codex@example.com
          GIT_COMMITTER_NAME: Codex
          GIT_COMMITTER_EMAIL: codex@example.com
        run: |
          set -euo pipefail
          source tools/repository-audit.sh
          initialize_repository_root
          run_python_coverage "$AUDIT_COVERAGE_DIR"
          run_shell_behavior_tests
      - name: Record actual heavy environment after tests
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/heavy-before.json" "$RUNNER_TEMP/coverage/linux/environment-before.json"
          python tools/quality/coverage-artifacts.py environment --platform linux \
            --output "$RUNNER_TEMP/coverage/linux/environment-after.json"
        env:
          AUDIT_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Upload measured linux qualification
        # actions/upload-artifact@v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-linux-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{
            github.run_attempt }}
          path: ${{ runner.temp }}/coverage/linux
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  compatibility-windows-heavy:
    name: Measured qualification - windows
    runs-on: windows-2025
    timeout-minutes: 45
    needs:
      - activation
      - quality-linux
      - compatibility-windows
      - qualification
    if: needs.activation.outputs.enabled == 'true' && needs.quality-linux.outputs.scope == 'source' && needs.qualification.outputs.decision
      == 'full'
    steps:
      - name: Checkout repository
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact audit revision
        shell: bash
        env:
          AUDIT_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$AUDIT_COMMIT_SHA"
      - name: Set up Python
        # actions/setup-python@v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: tools/quality/requirements.lock
      - name: Set up Node
        # actions/setup-node@v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            tools/quality/package-lock.json
            tools/quality/versions.json
      - name: Check quality declarations
        shell: bash
        run: python -B tools/quality/check-versions.py
      - name: Install locked language toolchains
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check `
            --require-hashes `
            --requirement tools/quality/requirements.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --ignore-scripts --prefix tools/quality
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install verified PowerShell and shell tools
        shell: pwsh
        run: |
          python tools/quality/install-external-tools.py `
            --platform windows-x64 `
            --tool PSScriptAnalyzer `
            --tool shellcheck `
            --tool shfmt `
            --install-root "$env:RUNNER_TEMP/quality-tools"
          Add-Content $env:GITHUB_PATH "$env:RUNNER_TEMP/quality-tools/bin"
          Add-Content $env:GITHUB_ENV `
            "PSModulePath=$env:RUNNER_TEMP/quality-tools/Modules$([IO.Path]::PathSeparator)$env:PSModulePath"
      - name: Record actual heavy environment before tests
        shell: bash
        run: |
          set -euo pipefail
          python tools/quality/coverage-artifacts.py environment --platform windows \
            --output "$RUNNER_TEMP/heavy-before.json"
        env:
          AUDIT_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Measure Windows Python coverage
        shell: pwsh
        env:
          AUDIT_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python -m coverage run --rcfile=tools/quality/pyproject.toml `
            --data-file "$env:RUNNER_TEMP/.coverage.windows" `
            tools/quality/coverage-artifacts.py tests --output "$env:RUNNER_TEMP/tests.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/quality/coverage-artifacts.py export `
            "$env:RUNNER_TEMP/.coverage.windows" `
            "$env:RUNNER_TEMP/coverage/windows" --platform windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m coverage json --rcfile=tools/quality/pyproject.toml `
            --data-file "$env:RUNNER_TEMP/.coverage.windows" --fail-under=0 `
            -o "$env:RUNNER_TEMP/coverage/windows/coverage.json"

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath "$env:RUNNER_TEMP/tests.json" -Destination "$env:RUNNER_TEMP/coverage/windows/tests.json"
      - name: Verify Git Bash hooks on Windows
        shell: bash
        run: |
          python tools/quality/coverage-artifacts.py shell --platform windows \
            --output "$RUNNER_TEMP/coverage/windows"
      - name: Record actual heavy environment after tests
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/heavy-before.json" "$RUNNER_TEMP/coverage/windows/environment-before.json"
          python tools/quality/coverage-artifacts.py environment --platform windows \
            --output "$RUNNER_TEMP/coverage/windows/environment-after.json"
        env:
          AUDIT_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Upload measured windows qualification
        # actions/upload-artifact@v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-windows-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{
            github.run_attempt }}
          path: ${{ runner.temp }}/coverage/windows
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  repository-audit:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Repository audit (manual)' || 'Repository audit' }}
    needs:
      - activation
      - quality-linux
      - compatibility-windows
      - qualification
      - quality-linux-heavy
      - compatibility-windows-heavy
    if: ${{ always() && needs.activation.outputs.enabled != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - env:
          LINUX_RESULT: ${{ needs.quality-linux.result }}
          WINDOWS_RESULT: ${{ needs.compatibility-windows.result }}
          ACTIVATION_RESULT: ${{ needs.activation.result }}
          DECISION_RESULT: ${{ needs.qualification.result }}
          DECISION: ${{ needs.qualification.outputs.decision }}
          SCOPE: ${{ needs.quality-linux.outputs.scope }}
          HEAVY_LINUX_RESULT: ${{ needs.quality-linux-heavy.result }}
          HEAVY_WINDOWS_RESULT: ${{ needs.compatibility-windows-heavy.result }}
        run: |
          set -euo pipefail
          test "$ACTIVATION_RESULT" = success
          test "$LINUX_RESULT" = success
          test "$WINDOWS_RESULT" = success
          test "$DECISION_RESULT" = success
          case "$DECISION" in
            reuse)
              test "$HEAVY_LINUX_RESULT" = skipped
              test "$HEAVY_WINDOWS_RESULT" = skipped
              ;;
            full)
              if [[ "$SCOPE" == source ]]; then
                test "$HEAVY_LINUX_RESULT" = success
                test "$HEAVY_WINDOWS_RESULT" = success
              elif [[ "$SCOPE" == project ]]; then
                test "$HEAVY_LINUX_RESULT" = skipped
                test "$HEAVY_WINDOWS_RESULT" = skipped
              else
                exit 1
              fi
              ;;
            *) exit 1 ;;
          esac
        name: Require selected checks to succeed
      - name: Checkout repository
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact audit revision
        shell: bash
        env:
          AUDIT_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$AUDIT_COMMIT_SHA"
      - name: Set up Python
        if: needs.quality-linux.outputs.scope == 'source'
        # actions/setup-python@v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/quality/requirements.lock
      - name: Install locked coverage runtime
        if: needs.quality-linux.outputs.scope == 'source'
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check \
            --require-hashes --requirement tools/quality/requirements.lock
      - name: Download Linux coverage
        if: needs.quality-linux.outputs.scope == 'source' && needs.qualification.outputs.decision == 'full'
        # actions/download-artifact@v8.0.1
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: coverage-linux-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{
            github.run_attempt }}
          path: ${{ runner.temp }}/coverage/linux
      - name: Download Windows coverage
        if: needs.quality-linux.outputs.scope == 'source' && needs.qualification.outputs.decision == 'full'
        # actions/download-artifact@v8.0.1
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: coverage-windows-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{
            github.run_attempt }}
          path: ${{ runner.temp }}/coverage/windows
      - name: Require combined coverage
        if: needs.quality-linux.outputs.scope == 'source' && needs.qualification.outputs.decision == 'full'
        shell: bash
        env:
          AUDIT_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python tools/quality/coverage-artifacts.py combine "$RUNNER_TEMP/coverage"
          python tools/quality/check-coverage.py "$RUNNER_TEMP/coverage/combined.json"
          python tools/quality/check-coverage.py "$RUNNER_TEMP/coverage/linux-rechecked.json"
      - name: Download fresh linux
        # actions/download-artifact@v8.0.1
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: qualification-fresh-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fresh
        if: needs.quality-linux.outputs.scope == 'source'
        continue-on-error: ${{ needs.qualification.outputs.decision == 'full' }}
      - name: Download fresh windows
        # actions/download-artifact@v8.0.1
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: qualification-fresh-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fresh
        if: needs.quality-linux.outputs.scope == 'source'
        continue-on-error: ${{ needs.qualification.outputs.decision == 'full' }}
      - name: Download verified original qualification
        # actions/download-artifact@v8.0.1
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: qualification-verified-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verified
        if: needs.qualification.outputs.decision == 'reuse'
      - name: Recheck transported original qualification
        shell: bash
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import json
          import os
          from pathlib import Path
          import sys
          sys.path.insert(0, 'tools/quality')
          import qualification
          root = Path.cwd()
          packet_root = Path(os.environ['RUNNER_TEMP']) / 'verified'
          packet = qualification.load(packet_root / 'packet.json')
          if packet['files'] != {name: qualification.digest(packet_root / name) for name in sorted(qualification.PACKET_FILES)}:
              raise SystemExit('verified qualification changed during transport')
          qualification.validate_pair(root, packet_root, packet['producer'], Path(os.environ['RUNNER_TEMP']) / 'fresh', qualification.context_from_environment())
          print(json.dumps(packet['producer'], sort_keys=True))
          PY
        if: needs.qualification.outputs.decision == 'reuse'
        env:
          AUDIT_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Seal eligible full producer
        shell: bash
        run: |
          python -B tools/quality/qualification.py seal \
            --measurements "$RUNNER_TEMP/coverage" --fresh "$RUNNER_TEMP/fresh" \
            --destination "$RUNNER_TEMP/qualification" --output "$RUNNER_TEMP/seal.json"
        if: github.repository == 'asphyx0r/git-starter-kit' && needs.quality-linux.outputs.scope == 'source' &&
          needs.qualification.outputs.decision == 'full'
        env:
          AUDIT_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        id: seal
      - name: Upload original producer qualification
        # actions/upload-artifact@v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qualification-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt
            }}
          path: ${{ runner.temp }}/qualification
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
        if: steps.seal.outputs.sealed == 'true'
    permissions:
      contents: read
      actions: read
  qualification-experiment:
    name: Qualification experiment - ${{ matrix.platform }} / sample ${{ matrix.sample }}
    needs:
      - activation
      - quality-linux
      - repository-audit
    if: github.repository == 'asphyx0r/git-starter-kit' && github.event_name == 'workflow_dispatch' && inputs.qualification_experiment
      && needs.activation.outputs.enabled == 'true' && needs.quality-linux.outputs.scope == 'source'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux
          - windows
        sample:
          - 1
          - 2
          - 3
        include:
          - platform: linux
            runner: ubuntu-24.04
            python: '3.11'
          - platform: windows
            runner: windows-2025
            python: '3.14'
    steps:
      - name: Checkout repository
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact audit revision
        shell: bash
        env:
          AUDIT_COMMIT_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$AUDIT_COMMIT_SHA"
      - name: Set up Python
        id: python-runtime
        # actions/setup-python@v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: tools/quality/requirements.lock
      - name: Set up Node
        id: node-runtime
        # actions/setup-node@v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            tools/quality/package-lock.json
            tools/quality/versions.json
      - name: Check quality declarations
        shell: bash
        run: python -B tools/quality/check-versions.py
      - name: Install locked language toolchains
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            --require-hashes --requirement tools/quality/requirements.lock
          npm ci --ignore-scripts --prefix tools/quality
      - name: Install verified Linux tools
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          python tools/quality/install-external-tools.py \
            --platform linux-x64 --install-root "$RUNNER_TEMP/quality-tools"
          echo "$RUNNER_TEMP/quality-tools/bin" >> "$GITHUB_PATH"
          echo "PSModulePath=$RUNNER_TEMP/quality-tools/Modules:${PSModulePath:-}" >> "$GITHUB_ENV"
      - name: Install verified Windows tools
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          python tools/quality/install-external-tools.py `
            --platform windows-x64 `
            --tool PSScriptAnalyzer --tool shellcheck --tool shfmt `
            --install-root "$env:RUNNER_TEMP/quality-tools"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content $env:GITHUB_PATH "$env:RUNNER_TEMP/quality-tools/bin"
          Add-Content $env:GITHUB_ENV `
            "PSModulePath=$env:RUNNER_TEMP/quality-tools/Modules$([IO.Path]::PathSeparator)$env:PSModulePath"
      - name: Download original Linux measurements
        # actions/download-artifact@v8.0.1
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: coverage-linux-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/coverage/linux
      - name: Download original Windows measurements
        # actions/download-artifact@v8.0.1
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: coverage-windows-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/coverage/windows
      - name: Download original fresh Linux environment
        # actions/download-artifact@v8.0.1
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: qualification-fresh-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fresh
      - name: Download original fresh Windows environment
        # actions/download-artifact@v8.0.1
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: qualification-fresh-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fresh
      - name: Measure experimental paths
        shell: bash
        env:
          EXPERIMENT_PLATFORM: ${{ matrix.platform }}
          PYTHON_CACHE_HIT: ${{ steps.python-runtime.outputs.cache-hit }}
          NPM_CACHE_HIT: ${{ steps.node-runtime.outputs.cache-hit }}
          EXPERIMENT_SAMPLE: ${{ matrix.sample }}
          AUDIT_COMMIT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: Codex
          GIT_AUTHOR_EMAIL: codex@example.com
          GIT_COMMITTER_NAME: Codex
          GIT_COMMITTER_EMAIL: codex@example.com
        run: |
          set -euo pipefail
          python -B tests/qualification_experiment.py run \
            --platform "$EXPERIMENT_PLATFORM" --sample "$EXPERIMENT_SAMPLE" \
            --measurements "$RUNNER_TEMP/coverage" --fresh "$RUNNER_TEMP/fresh" \
            --output "$RUNNER_TEMP/experiment"
      - name: Upload experimental sample
        if: always()
        # actions/upload-artifact@v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: experiment-${{ matrix.platform }}-${{ matrix.sample }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/experiment
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  experiment-aggregate:
    name: Qualification experiment results
    needs:
      - activation
      - quality-linux
      - repository-audit
      - qualification-experiment
    if: github.repository == 'asphyx0r/git-starter-kit' && github.event_name == 'workflow_dispatch' && inputs.qualification_experiment
      && needs.activation.outputs.enabled == 'true' && needs.quality-linux.outputs.scope == 'source'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact audit revision
        shell: bash
        env:
          AUDIT_COMMIT_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$AUDIT_COMMIT_SHA"
      - name: Set up Python
        # actions/setup-python@v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/quality/requirements.lock
      - name: Install locked coverage runtime
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check \
            --require-hashes --requirement tools/quality/requirements.lock
      - name: Download experimental samples
        # actions/download-artifact@v8.0.1
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: experiment-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/experiment-input
          merge-multiple: true
      - name: Aggregate experimental evidence
        shell: bash
        env:
          AUDIT_COMMIT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -B tests/qualification_experiment.py aggregate \
            --input "$RUNNER_TEMP/experiment-input" --output "$RUNNER_TEMP/experiment-results"
      - name: Publish experimental summary
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/experiment-results/result.summary.md" ]]; then
            cat "$RUNNER_TEMP/experiment-results/result.summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload experimental results
        if: always()
        # actions/upload-artifact@v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: experiment-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/experiment-results
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
