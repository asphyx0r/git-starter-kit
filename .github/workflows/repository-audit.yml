---
name: Repository audit

"on":
  release:
    types: [published]
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.25.1"
  SHFMT_VERSION: v3.13.1

jobs:
  markdown:
    name: Markdown lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        # actions/checkout@v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Run markdown audit
        run: bash tools/repository-audit.sh markdown

  spelling:
    name: Spelling
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        # actions/checkout@v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Run spelling audit
        run: bash tools/repository-audit.sh spelling

  static:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        # actions/checkout@v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Go
        # actions/setup-go@v6.4.0
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          cache: false
          go-version: ${{ env.GO_VERSION }}

      - name: Install Shfmt
        shell: bash
        run: |
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"
          go install "mvdan.cc/sh/v3/cmd/shfmt@${SHFMT_VERSION}"

      - name: Run static audit
        shell: bash
        env:
          BEFORE_SHA: >-
            ${{ github.event_name == 'release' &&
            '0000000000000000000000000000000000000000' ||
            github.event.before }}
          GIT_AUTHOR_NAME: Codex
          GIT_AUTHOR_EMAIL: codex@example.com
          GIT_COMMITTER_NAME: Codex
          GIT_COMMITTER_EMAIL: codex@example.com
        run: bash tools/repository-audit.sh static

  repository-audit:
    name: >-
      ${{ github.event_name == 'workflow_dispatch' &&
      'Repository audit (manual)' || 'Repository audit' }}
    needs:
      - markdown
      - spelling
      - static
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Require every audit job
        env:
          MARKDOWN_RESULT: ${{ needs.markdown.result }}
          SPELLING_RESULT: ${{ needs.spelling.result }}
          STATIC_RESULT: ${{ needs.static.result }}
        run: |
          if [ "$MARKDOWN_RESULT" != "success" ] ||
            [ "$SPELLING_RESULT" != "success" ] ||
            [ "$STATIC_RESULT" != "success" ]; then
            printf '%s\n' \
              "Repository audit requires every child job to succeed." >&2
            exit 1
          fi
